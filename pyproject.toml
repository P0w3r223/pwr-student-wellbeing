[project]
name = "dobrostan-studentow-pwr"
version = "1.0.0"
description = "Analiza dobrostanu studentów Politechniki Wrocławskiej na podstawie badania ankietowego"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<1",
    "scikit-posthocs>=0.9,<1",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "Unidecode>=1.3,<2",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.0,<5", "nbformat>=5.9,<6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
